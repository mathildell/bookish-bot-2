# Bookish Hideaway - single configuration file.
# Copy this file to config.yaml and fill in real values. config.yaml is gitignored.

# Discord bot token (from the Discord Developer Portal)
discord_token: "REPLACE_WITH_YOUR_BOT_TOKEN"

# The guild (server) the bot operates in
guild_id: 123456789012345678

# Role whose members may add/edit/remove their OWN booster reaction
# (members with Manage Server can manage anyone; 0 disables the role)
booster_role_id: 0

# Channel where the bot posts when a booster stops boosting and their custom
# role is unlinked (0 disables the notice)
bot_updates_channel_id: 0

# Channel where the bot announces level-ups, e.g. a testing channel
# (0 disables the notice)
level_up_channel_id: 1406126242192953404

# MySQL database (the compose file provisions these defaults)
mysql:
  host: "127.0.0.1"
  port: 3306
  database: "bookish_hideaway"
  username: "bookish"
  password: "bookish"

# Default colour applied to every embed the bot sends (hex)
default_embed_color: "#97A97C"

# Transparent image used as the background of booster listing embeds
transparent_embed_image: "https://i.imgur.com/example.png"

