boosters:
  group_description: "Manage custom booster reactions"
  add:
    description: "Register a booster's custom emoji"
    param_user: "The user boosting the server"
    param_emoji: "Emoji to react with (unicode or <:name:id>)"
    param_nicknames: "Optional comma-separated nicknames to also match"
    invalid_emoji: "`%{emoji}` doesn't look like a valid emoji."
    success: "%{emoji} **%{user}** is registered (id `%{id}`)%{extra}"
  edit:
    description: "Change a booster's reaction emoji or nicknames"
    param_user: "The user to update"
    param_emoji: "New emoji (leave empty to keep the current one)"
    param_nicknames: "New comma-separated nicknames (leave empty to keep current)"
    not_found: "%{user} has no booster reaction registered."
    invalid_emoji: "`%{emoji}` doesn't look like a valid emoji."
    nothing_to_change: "Provide a new emoji and/or nicknames to change."
    success: "%{emoji} **%{user}** updated (id `%{id}`)%{extra}"
  view:
    description: "Show a booster's reaction emoji and matching identifiers"
    param_user: "The booster to inspect"
    not_found: "%{user} has no booster reaction registered."
    success: "%{emoji} **%{user}** triggers: `%{primary}`%{extra} (id `%{id}`)"
  remove:
    description: "Remove a booster's custom reaction emoji"
    param_user: "The booster to unregister"
    success: "Removed %{user}'s booster reaction."
    not_found: "%{user} has no booster reaction registered."
