# Texts for reusable UI components (pagination buttons, permissions, etc.).
components:
  pagination:
    prev: "Prev"
    prev_emoji: "<:chevronPrev:1559682407987413145>"
    next: "Next"
    next_emoji: "<:chevronNext:1559682424940797992>"
    page_x_of_y: "Page %{current} of %{total} • %{results} results"
  # Shared by any component whose buttons are usable only by the invoker.
  not_author: "Sneaky little thing! Only the command author can use these buttons."
  expired: "These buttons have expired. Run the command again if you need them."
  leaderboard:
    placement_1: "🥇"
    placement_2: "🥈"
    placement_3: "🥉"
    placement_other: "%{place}."
  permissions:
    no_permission: "Can’t fault you for trying, but you really can’t do that. :eyes: "
  # Day names, in Python's weekday order (Monday first).
  weekday:
    monday: "Monday"
    tuesday: "Tuesday"
    wednesday: "Wednesday"
    thursday: "Thursday"
    friday: "Friday"
    saturday: "Saturday"
    sunday: "Sunday"
  months:
    "1": "January"
    "2": "February"
    "3": "March"
    "4": "April"
    "5": "May"
    "6": "June"
    "7": "July"
    "8": "August"
    "9": "September"
    "10": "October"
    "11": "November"
    "12": "December"
  months_short:
    "1": "Jan"
    "2": "Feb"
    "3": "Mar"
    "4": "Apr"
    "5": "May"
    "6": "Jun"
    "7": "Jul"
    "8": "Aug"
    "9": "Sep"
    "10": "Oct"
    "11": "Nov"
    "12": "Dec"
  date:
    month_day: "%{month} %{day}"
    month_day_year: "%{month} %{day}, %{year}"
  time:
    short_am: "%{hour}:%{minute}AM"
    short_pm: "%{hour}:%{minute}PM"
    hour_am: "%{hour}:00 AM"
    hour_pm: "%{hour}:00 PM"
