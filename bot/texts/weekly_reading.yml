# Texts for the weekly reading prompts feature.
weekly_reading:
  group_description: "Post a reading prompt in your server every week"

  channel:
    group_description: "Where the reading prompt is posted"
    set:
      description: "Set the channel the prompt is posted in"
      param_channel: "Channel to post the prompt in"
      success: "Reading prompts will be posted in %{channel}."
  role:
    group_description: "Who gets pinged with the prompt"
    set:
      description: "Set the role pinged when the prompt is posted"
      param_role: "Role to ping when the prompt is posted"
      success: "Reading prompts will ping %{role}."
    remove:
      description: "Stop pinging a role with the prompt"
      success: "Reading prompts no longer ping a role."
  schedule:
    group_description: "When the reading prompt is posted"
    set:
      description: "Set the day and hour (UTC) the prompt is posted on"
      param_day: "Day of the week (UTC)"
      param_hour: "Hour of the day (UTC, 0-23)"
      success: "Reading prompts will be posted every %{weekday} at %{hour}:00 UTC."
  pause:
    description: "Stop the weekly prompt from being posted"
    success: "Weekly reading prompts are paused."
  resume:
    description: "Resume the weekly prompt"
    success: "Weekly reading prompts are active again."
  force:
    description: "Post a reading prompt right now"
    no_channel: "No channel is set yet. Use `/weekly-reading channel set` first."
    no_cards: "The deck is empty. Add a prompt with `/weekly-reading cards add`."
    success: "Posted a reading prompt in %{channel}."
    failed: "I couldn’t post the reading prompt: %{error}"
  status:
    description: "Show the current reading prompt settings"
    title: "Weekly reading prompts"
    channel_field: "Channel"
    role_field: "Role"
    schedule_field: "Schedule"
    schedule_unset: "Not set"
    schedule_value: "Every %{weekday} at %{hour}:00 UTC"
    state_field: "Status"
    state_active: "Active"
    state_paused: "Paused"
    deck_field: "Deck"
    deck_value: "%{pending} waiting, %{total} in total"
    last_posted_field: "Last posted"
    never_posted: "Never"
    channel_unset: "Not set"
    role_unset: "No role pinged"

  cards:
    group_description: "The deck of prompts the weekly post draws from"
    add:
      description: "Add a reading prompt to the deck"
      param_title: "The prompt’s title"
      param_description: "Extra text shown under the title (optional)"
      success: "Added the reading prompt “%{title}”."
    edit:
      description: "Change a reading prompt in the deck"
      param_card: "Which prompt (start typing to search)"
      param_title: "A new title"
      param_description: "New text under the title (optional)"
      success: "Updated the reading prompt “%{title}”."
    remove:
      description: "Remove a reading prompt from the deck"
      param_card: "Which prompt (start typing to search)"
      success: "Removed the reading prompt “%{title}”."
    list:
      description: "List the reading prompts in the deck"
      empty: "The deck is empty. Add a prompt with `/weekly-reading cards add`."
      title: "Reading prompt #%{id}"
      pending: "Waiting to be posted"
      posted: "Posted %{when}"

  post:
    embed_title: "This week's reading prompt"

  errors:
    generic: "Something went wrong with that reading prompt."
    missing_title: "The prompt needs a title."
    title_too_long: "That title is %{length} characters long; the max is %{maximum}."
    description_too_long: "That description is %{length} characters long; the max is %{maximum}."
    duplicate_card: "A prompt with the title “%{title}” is already in the deck."
    card_not_found: "I couldn’t find a prompt with id %{id}."
    invalid_weekday: "That isn’t a day of the week I recognise."
    invalid_hour: "`%{hour}` isn’t a valid hour of the day (0-23)."
