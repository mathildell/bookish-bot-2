# Texts for the upcoming book releases feature.
releases:
  group_description: "Track upcoming book releases and announce them"
  months:
    "1": "January"
    "2": "February"
    "3": "March"
    "4": "April"
    "5": "May"
    "6": "June"
    "7": "July"
    "8": "August"
    "9": "September"
    "10": "October"
    "11": "November"
    "12": "December"
  sources:
    goodreads: "Goodreads"
    netgalley: "NetGalley"
  date:
    plain_without_year: "%{month} %{day}"
    plain: "%{month} %{day}, %{year}"
  added_thanks: "Thank you for adding the following book to our calendar! I will ping you in %{channel} on %{date}."
  add:
    description: "Add an upcoming book from a Goodreads or NetGalley URL"
    param_url: "Goodreads or NetGalley book URL"
  update:
    description: "Refresh a tracked book from its URL"
    param_url: "Goodreads or NetGalley URL for the book"
    param_book: "Numeric id or handle of the book to update, if its title changed"
    old_prefix: ":one:"
    new_prefix: ":two:"
    confirm: "Confirm update"
    confirm_emoji: "✅"
    instruction_title: "Confirmation"
    instruction_body: |
      **Please confirm this is the book you want to update in the calendar:**
      - :one: The first container is the book we currently have in our calendar, with all the information available at the time.
      - :two: The second container is the information we fetched from the URL provided, which will override the previously saved details.

      If this doesn't look right, please feel free to ignore this message (click *"Dismiss message"* underneath) or Cancel.
    cancel: "Cancel"
    confirmed: "All done!"
    cancelled: "Okay, I'll hold off then."
    expired: "This update has expired, please run the command again."
    not_found: "Can't seem to find a book that matches that URL, id or handle. Try `/releases add` to add it!"
  search:
    description: "Search tracked books by title, author, or the member who added them"
    param_keyword: "Keyword, or a member mention/id, to search for"
    found: "Here's what turned up for your search:"
    not_found: "I couldn't find a book matching **%{keyword}**. Maybe you should add it with `/releases add url:`"
  view:
    description: "Show one tracked book"
    param_book: "Numeric id or handle of the tracked book"
    not_found: "No tracked book matching **%{query}**."
  list:
    description: "List upcoming releases"
    empty: "No upcoming releases are tracked yet."
    jump_to_month: "Jump to a month"
    month_option: "%{month} %{year}"
  remove:
    description: "Remove a tracked book (admins only)"
    param_book: "Numeric id or handle of the book to remove"
    success: "Removed **%{title}**."
    not_found: "No tracked book matching **%{query}**."
  channel:
    group_description: "Where release announcements are posted"
    unset: "the announcements channel"
    set:
      description: "Set the release announcements channel"
      param_channel: "Channel for release announcements"
      success: "Release announcements will be posted in %{channel}."
  role:
    group_description: "Role pinged with release announcements"
    set:
      description: "Set the role to ping with announcements"
      param_role: "Role to ping"
      success: "Announcements will ping %{role}."
  force:
    group_description: "Force the bot to post an announcement now"
    no_channel: "No release channel is set. Use `/releases channel set` first."
    daily:
      description: "Post today's release announcement now"
      success: "Posted today's announcement for %{count} book(s)."
      none: "No books are releasing today."
    monthly:
      description: "Post this month's release overview now"
      success: "Posted this month's overview for %{count} book(s)."
      none: "No books are releasing this month."
  embed:
    untitled_book: "Untitled"
    author_field: "Author(s)"
    author_none: "Unknown"
    release_date_field: "Release date"
    tags_field: "Tags"
    tags_none: "—"
    description_field: "Description"
    added_by: "Added by %{user} via %{source} (id: %{reference})"
    added_by_unknown: "Added via %{source} (id: %{reference})"
  month_embed:
    title: "Upcoming releases"
    date: "%{month} %{day}"
    line: "**%{title}** by %{authors} (%{user})"
    unknown_author: "Unknown"
    footer_singular: "%{count} release"
    footer_plural: "%{count} releases"
  post:
    daily_title_singular: "## 📣 New book just released!"
    daily_title_plural: "## 📣 New books just released!"
    daily_thanks_singular: "Thank you %{mentions} for adding it to our calendar 📚\n ‎ "
    daily_thanks_plural: "Thank you %{mentions} for adding them to our calendar 📚\n ‎ "
    monthly_title: "## ✨📖 New releases coming in %{month}!"
    monthly_thanks: "Here are the releases to look forward to this month! We'll send a reminder pinging the following role as well as each books' finder, on the day of :yellow_heart: "
  errors:
    invalid_url: "That doesn't look like a valid book URL."
    invalid_path: "That URL doesn't point to a specific book page."
    unsupported_source: "Only Goodreads and NetGalley links are supported."
    unsupported_region: "Only NetGalley's .com, .co.uk, .fr and .de sites are supported."
    no_release_date: "I couldn't find a release date on that page."
    not_in_future: "Looks like that book has already been released. You're in luck then! :money_with_wings: "
    scrape_failed: "I couldn't read that page. The link may be wrong, or the site may be blocking me out."
    browser_missing: "There was a problem with the browser reading the provided web page."
    already_exists_self: "You already added **%{title}** on %{date} silly! If you need to update it, use `/releases update`"
    already_exists_other: "**%{title}** was already added by %{member} on %{date}. Looks like you folks have the same taste, that's pretty neat!"
