# Texts for the reading streak feature.
streaks:
  group_description: "Challenge yourself to read everyday 🔥"
  icons:
    upcoming: "⚫"
    success: "<:strsuccess:1561017658508316843>"
    success_today: "<a:strsuccesstoday:1561017657241772104>"
    partial: "<:strfailure:1561071578685644840>"
    zero: "<:strzero:1561071579855716422>"
    rescue: "<:rescue:1561068364263198750>"
    golden: "<a:golden:1561080719881801939>"

  shared:
    goal_field: "Daily goal"
    timezone_field: "Timezone"
    timezone_value: "%{timezone}\n-# %{current}"
    notification_field: "Reminders"
    level_field: "Streak level"
    level_value: "💫 ‎ Level %{level}"
    per_day: "%{amount} %{unit} a day"
    date_field: "Date"
    rescue_button: "Repair streak"
    reminder:
      none: "No reminder"
      custom: "Reminder at %{hour}"
      last_chance: "Last chance reminder (11PM)"
      both: "%{hour}, plus last chance (11PM)"
    reminder_options: |
      ### ❌ ‎ None
      > You will not be pinged for streak reminders
      ### 🕑 ‎ Custom time
      > Choose at which hour to receive your notification on (will ping you at the same time everyday)
      ### 🌙 ‎ Last Chance Reminder
      > Get notified one hour before your streak closes (11PM local time) **if** you haven’t logged on that day
      ### 2️⃣ ‎ Both
      > Receive both a daily reminder at the hour of your choosing and a last chance alert (if you haven't logged)

  register:
    description: "Set or rewrite your daily reading goal"
    param_amount: "How many (pages, minutes, chapters...)"
    param_unit: "Unit (pages, minutes, chapters...)"
    param_timezone: "Your timezone (start typing to search)"
    step_title: "Let's register that goal!"
    step_description: |
      You've taken the first step to register your daily goal! I will mark you down for **%{amount} %{unit}**, in the **%{timezone}** timezone. To finish the registration, please complete the following process.
          
      Once your goal has been saved, you can edit it at any time without losing your progress. To adjust notifications or revisit this menu later, you can run the following command:
      ```
      /streak edit
      ``` 
      ## Pick your reminder option:
      %{options}
    custom_title: "Pick your hour"
    custom_description: "Pick any hour from 1AM to 10PM\n-# **Note:** 11PM is covered by Last Chance Reminder and midnight are when the streaks close, so they aren't selectable options."
    custom_placeholder: "Reminder hour"
    confirmed_title: "Goal set"
    confirmed_description: "All set-up! You can edit this at any time using `/streak edit`. I'll keep my eye on you... :eyes:"

  edit:
    description: "Change your daily goal or your reminders"
    title: "Editing your streak"
    menu_description: "What would you like to change? Your streak's progress will stay untouched."
    amount_unit_button: "Amount & unit"
    timezone_button: "Timezone"
    reminders_button: "Reminders"
    button_on_view: "Edit your goal"
    amount_modal_title: "Daily amount & unit"
    amount_param: "How many (pages, minutes, chapters...)"
    unit_param: "Unit (pages, minutes, chapters...)"
    timezone_modal_title: "Your timezone"
    timezone_param: "Your timezone (e.g. Europe/Paris)"
    reminders_title: "Pick your reminder option"
    reminders_description: "%{options}"
    amount_confirmation: "**Amount & unit updated.** Your streak and progress are unchanged."
    timezone_confirmation: "**Timezone updated.** Your streak and progress are unchanged."
    reminders_confirmation: "**Reminders updated.** Your streak and progress are unchanged."

  log:
    description: "Log how much you read today"
    param_amount: "Amount read today (`+`/`-` aggregators also work)"
    title: "Logged"
    amount_field: "Logged"
    amount_value: "%{amount} %{unit}"
    level_up_title: "Level cleared"
    level_up_content: |
      You’ve logged your progress every day for %{days} days! You’ve reached **💫 ‎ Level %{level}**, earned a **%{rescue_emoji} ‎ Streak Rescue** and are now eligible for a **%{xp} XP** reward. Here is a coupon to show off your progress!
    level_up_50th: |
      Wow, you've also earned a **%{rescue_emoji} Golden Streak Rescue**. It'll be useful if you ever miss the repair window!
    level_up_anniversary: " This is your ***Streanniversary!*** 🎉🎂 ‎ I've added a little extra XP to celebrate. Good job!"
    achievement_field: "Daily achievement"
    achievement_success_value: "You reached **%{percent}%** of your goal of %{amount} %{unit} today!"
    achievement_failure_value: "Not quite there yet. It's okay, there's always tomorrow."
    dry_run: "We're in test mode, so that **%{xp} XP** wasn't actually added to your XP total yet."
    top_up_title: "Goal reached"
    top_up_content: "You already received XP for finishing your level earlier, but you deserve a little more for completing today. Here's the **%{xp} XP** you are owed!"

  rescue:
    title: "Streak rescued"
    content: "Your **%{emoji} ‎ Streak Rescue** saved **%{days} days**, completing **💫 ‎ Level %{level}** and earning you **%{xp} XP**."
    content_one: "Your **%{emoji} ‎ Streak Rescue** saved **1 day**, completing **💫 ‎ Level %{level}** and earning you **%{xp} XP**."
  
  today:
    description: "Have you logged today?"
    "yes": "✅ ‎ All good! Logged **%{amount} %{unit}** on %{date}."
    no_first: "❌ ‎ Oops, no. Looks like you haven't logged anything yet."
    this: "this"
    these: "these"
    hurry: "Better get %{this} %{amount} %{unit} quickly, your streak closes %{closes}."
    not_registered: "I can't find a goal for you. You should run `/streak register` first!"

  view:
    description: "Inspect a streak"
    param_user: "Whose streak (defaults to you)"
    title: "%{user}'s streak"
    no_streak: "No streak yet: you haven't logged a single day. Run `/streak log` to log your daily amount and get started!"
    streak_gone: "This streak is over and can no longer be saved. It will be missed... Whenever you're ready, log a day to start over."

  info:
    closed_field: "Closed"
    started_field: "Streak started"
    started_value: "%{date}\n-# %{days} days"
    rescues_field: "Rescues"
    rescues_value: |
      %{rescue_emoji} ‎ %{normal} available (%{normal_used})
      %{golden_emoji} ‎ %{golden} golden (%{golden_used})
    closes_field: "Streak closes"
    closes_value: "<t:%{ts}:R>"
    closed_rescuable_value: "⚠️ ‎ %{date}"
    logged_field: "Latest log"
    logged_yes: "%{date}\n-# ✅ ‎ Logged today"
    logged_no: "%{date}\n-# ❌ ‎ Not logged yet"
    coupon_field: "Last coupon"
    coupon_none: "No coupon yet"
    coupon_value: "%{date}"
    total_xp_field: "Last XP"
    total_xp_value: "%{xp} XP"
    on_track_field: "Next XP"
    on_track_value: "**%{xp} XP**"
    yesterday_field: "Last achievement"
    yesterday_value: "%{amount} %{unit}"
    yesterday_percent: "-# %{percent}% achieved"
    dry_icon: "🫧"
    dry_run_field: "Dry run"
    dry_run_value: "XP gain is off. Progress still counts, your pool stays empty."

  closed:
    title: "Streaks closed"
    entry: "- %{user} (`%{id}`): %{date}"

  leaderboard:
    description: "Streaks Leaderboard"
    ongoing_button: "   Top ongoing streaks"
    ongoing_emoji: "🏅"
    all_time_button: "   Top streaks of all-time"
    all_time_emoji: "🏆"
    ongoing_title: "Streaks Leaderboard ( 🏅   Currently Ongoing)"
    all_time_title: "Streaks Leaderboard ( 🏆   All Time)"
    ongoing_desc: "The following are the top streaks currently ongoing in the server! Keep them going!"
    all_time_desc: "The following are the highest streaks ever recorded by the bot!"
    entry: "**%{place} %{mention}**"
    days_details: "-# **%{days}** days (level %{level})   `-`   %{date}\n"
    empty: "No streaks to rank yet."

  channel:
    group_description: "Where streaks live"
    set:
      description: "Set the channel for streak commands and reminders"
      param_channel: "The channel"
      success: "Streaks updates and daily logs will happen in %{channel} now."

  admin:
    group_description: "Streak maintenance for admins"
    log:
      description: "Backfill a missed daily log and adjust the streak"
      param_user: "Whose streak to fix"
      param_amount: "The amount to record"
      param_date: "Date to record it for (YYYY-MM-DD; defaults to today)"
      success: "Recorded `%{amount}` for %{user} on %{date}."
      success_reopened: "Recorded `%{amount}` for %{user} on %{date}, and reopened the streak it broke."
    dryrun:
      description: "Turn XP gain from streaks on or off"
      param_state: "Whether streak XP reaches members"
      "on": "Dry run enabled. Streak XP is now a rehearsal; nobody's pool changes."
      "off": "Dry run disabled. Streak XP counts for real again."

  errors:
    generic: "Something went sideways. Don't look at me like that, I'm trying my best!"
    not_registered: "No streak goal found. Run `/streak register`!"
    invalid_amount: "`%{raw}` doesn't appear to be a number I can log. Try `30`, `+10` or `-5`."
    amount_positive: "That's some big brain strategy :brain: but your goal has to be more than zero."
    invalid_timezone: "`%{timezone}` isn't a timezone I recognise; please try looking up a metropolis near you instead."
    invalid_date: "`%{raw}` isn't a date I can work with, please use `YYYY-MM-DD`."
    wrong_channel: "Oops, this isn't the streak channel! Try there instead: %{channel}."
    already_registered: "You already have a streak going. Use `/streak edit` to change it instead."
    cant_rescue: "That streak can't be rescued anymore. It had a good run. We will remember it fondly."

  reminders:
    title: "A small reminder"
    content:
      - "Oye, oye %{mentions}, your streak would like a word with you!"
      - "%{mentions} daily reminder to stay hydrated... and log your daily achievement!"
      - "Gentle nudge for %{mentions}; it's time to log your streak."
      - "Hello %{mentions}! Have you made any progress on those books today?"
    last_chance_title: "Last chance"
    last_chance_content:
      - "Tick tock %{mentions}, there's only one hour left until midnight!"
      - "%{mentions}, you still have a chance to log before you streak closes!"
      - "Your streak is about to close %{mentions} <a:aBunnyPanic:1494097440503103508>"
      - "%{mentions}, we're reaching threat level midnight!"
    footer: "Use /streak log to log your daily progress"

  anniversary:
    title: "A whole year"
    content: "<@%{user_id}> has kept a reading streak alive for a full year! **%{days} days total**. WOW!"
    footer: "Three hundred and sixty-five days. Some people plant trees for this."
