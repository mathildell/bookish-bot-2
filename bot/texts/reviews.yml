# Texts for the Goodreads review sharing feature.
reviews:
  group_description: "Share members’ new Goodreads reviews"
  feed:
    group_description: "Manage a member’s Goodreads reviews profile"
    add:
      description: "Link a Goodreads profile"
      param_url: "Goodreads profile URL (legacy list_rss URLs also work)"
      param_user: "Member to set the profile for (admins only; defaults to you)"
      success: "Saved %{user}’s Goodreads profile."
      success_reset: "Saved %{user}’s Goodreads profile. Existing reviews won’t be posted, only new ones."
      invalid_url: "That doesn’t look like a Goodreads profile URL. Open your Goodreads profile and copy the address from the browser, then paste it here."
    remove:
      description: "Unlink a Goodreads profile"
      param_user: "Member whose profile to remove (admins only; defaults to you)"
      success: "Removed %{user}’s Goodreads profile."
      not_found: "%{user} has no Goodreads profile registered."
    list:
      description: "List every registered Goodreads profile"
      empty: "No Goodreads profiles are registered."
      url_field: "Profile URL"
  channel:
    group_description: "Where review updates are posted"
    set:
      description: "Set the channel for Goodreads review updates"
      param_channel: "Channel to post review updates in"
      success: "Review updates will be posted in %{channel}."
  repost:
    description: "Force the bot to repost a review"
    param_entry: "Goodreads review URL or review id"
    param_user: "Member whose review to repost (admins only; defaults to you)"
    success: "Reposted %{user}’s review %{entry}."
    not_found: "No posted review matching %{entry} was found in the profile’s recent updates."
    no_channel: "No review channel is set, so entry %{entry} can’t be reposted."
    auth_failed: "The Goodreads session cookie has expired, so the review was not reposted. Update it with `/settings edit`."
    no_cookie: "No Goodreads session cookie is set yet, so reviews can’t be fetched or reposted. Set one with `/settings edit`."
  embed:
    untitled_book: "Untitled"
    shelf_none: "%{user}’s shelf"
    shelf_tags: "%{user}’s bookshelf: %{tags}"
    shelf_arc: "🌟 %{shelf}"
    unknown_member: "Unknown member"
    author_none: "Unknown"
    title_suffix: " ‎ ↗️"
    author_field: "Author(s)"
    date_read_field: "Date read"
    rating_field: "Rating"
    review_field: "Review"
    rating_value: "%{rating} ⭐"
    rating_none: "No rating"
    date_read_none: "Unknown"
    review_empty: "(no review text)"
    view_spoiler: "(view spoiler)"
  errors:
    auth_failed_title: "Goodreads session expired"
    auth_failed_description: "The configured Goodreads cookie can no longer read review pages, so new reviews are on hold. Update it with `/settings edit`."
    missing_cookie_title: "Goodreads cookie not set"
    missing_cookie_description: "No Goodreads session cookie is configured, so new reviews are on hold and nothing is posted until one is set with `/settings edit`."
