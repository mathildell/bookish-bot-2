# Texts for the bi-weekly theme feature.
biweekly_theme:
  group_description: "Post a themed reading prompt in the server every two weeks"

  channel:
    group_description: "Where the bi-weekly theme is posted"
    set:
      description: "Set the channel the theme is posted in"
      param_channel: "Channel to post the theme in"
      success: "Bi-weekly themes will be posted in %{channel}."
  role:
    group_description: "Who gets pinged"
    set:
      description: "Set the role pinged when the theme is posted"
      param_role: "Role to ping when the theme is posted"
      success: "Bi-weekly themes will ping %{role}."
  schedule:
    group_description: "When the bi-weekly theme is posted"
    set:
      description: "Set the day and hour (UTC) the theme is posted on"
      param_day: "Day of the week (UTC)"
      param_hour: "Hour of the day (UTC, 0-23)"
      success: "Themes will be posted every other %{weekday} at %{hour}:00 UTC."
  toggle:
    description: "Pause or resume the bi-weekly theme"
    success_active: "Bi-weekly themes are active again."
    success_paused: "Bi-weekly themes are paused."
  force:
    description: "Post a bi-weekly theme right now"
    param_card: "Card id to force (optional)"
    no_channel: "No channel is set yet. Use `/biweekly-theme channel set` first."
    no_cards: "The deck is empty. Add a theme with `/biweekly-theme cards add`."
    success: "Posted a theme card in %{channel}."
    failed: "I couldn’t post the card: %{error}"
  status:
    description: "Show the current bi-weekly theme settings"
    title: "Bi-weekly themes"
    channel_field: "Channel"
    role_field: "Role"
    schedule_field: "Schedule"
    schedule_unset: "Not set"
    schedule_value: "Every second %{weekday} at %{hour}:00 UTC"
    state_field: "Status"
    state_active: "Active"
    state_paused: "Paused"
    title_field: "Title"
    description_field: "Description"
    deck_field: "Deck"
    deck_value: "%{pending} waiting, %{total} in total"
    last_posted_field: "Last posted"
    never_posted: "Never"
    channel_unset: "Not set"
    role_unset: "No role pinged"

  cards:
    group_description: "The deck of cards the bi-weekly post draws from"
    add:
      description: "Add a card to the deck"
      param_title: "The card’s main prompt"
      param_description: "Extra text shown under the prompt (optional)"
      success: "Added the card “%{title}”."
    edit:
      description: "Change a card in the deck"
      param_card: "Which card (start typing to search)"
      param_title: "A new main prompt"
      param_description: "New text under the prompt (optional)"
      success: "Updated the card “%{title}”."
    remove:
      description: "Remove a card from the deck"
      param_card: "Which card (start typing to search)"
      success: "Removed the card “%{title}”."
    list:
      description: "List the cards in the deck"
      empty: "The deck is empty. Add a card with `/biweekly-theme cards add`."
      title: "Card #%{id}"
    search:
      description: "Search theme cards by prompt or description"
      param_keyword: "Keyword to search for"
      found: "Here’s what turned up for your search:"
      not_found: "I couldn’t find a theme card matching **%{keyword}**."
    suggest:
      description: "Suggest a theme card"
      param_prompt: "The suggested prompt"
      param_description: "Description shown under the prompt (optional)"
      modal_title: "Suggest a bi-weekly prompt"
      modal_prompt_label: "Prompt"
      modal_description_label: "Description (optional)"
      button_label: "Suggest a prompt"
      button_emoji: "🎠"
      success: "Thanks! Your suggestion has been sent out for approbation."
      closed: "Suggestions are closed for now."
      no_text: "Add a prompt before submitting your suggestion."
    review:
      title: "Theme suggestion"
      prompt_field: "Prompt"
      description_field: "Description"
      suggester_field: "Suggested by"
      approve: "Approve"
      approve_emoji: "✅"
      refuse: "Refuse"
      refuse_emoji: "❌"
      already_handled: "This suggestion has already been handled."
      approb_status: "Approbation status"
      approved: "✅ ‎ Approved by %{user}"
      refused: "❌ ‎ Refused by %{user}"
      no_feed: "The admins' updates channel isn't set, so suggestions can't be sent."

  post:
    heading: "## 🗓️ ‎ This forthnight’s theme"
    second_heading: "### %{title}"
    failed_title: "Bi-weekly theme image failed"
    failed_description: "Couldn’t create the image for the theme “%{title}”. This run was skipped; the theme stays in the deck.\n\nError: %{error}"
  audit:
    pin: "Pinned this fortnight’s theme"
    unpin: "Unpinned the previous theme"

  suggest:
    credit: "Suggested by %{name}"

  errors:
    generic: "Something went wrong with that card."
    missing_title: "The card needs a main prompt."
    title_too_long: "That prompt is %{length} characters long; the max is %{maximum}."
    description_too_long: "That description is %{length} characters long; the max is %{maximum}."
    duplicate_card: "A card with the prompt “%{title}” is already in the deck."
    card_not_found: "I couldn’t find a card with id %{id}."
    invalid_weekday: "That isn’t a day of the week I recognise."
    invalid_hour: "`%{hour}` isn’t a valid hour of the day (0-23)."
    image_failed: "I couldn’t create the card image for “%{title}”: %{error}"
