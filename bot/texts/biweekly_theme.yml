# Texts for the bi-weekly theme feature.
biweekly_theme:
  group_description: "Post a themed reading prompt in your server every two weeks"

  channel:
    group_description: "Where the bi-weekly theme is posted"
    set:
      description: "Set the channel the theme is posted in"
      param_channel: "Channel to post the theme in"
      success: "Bi-weekly themes will be posted in %{channel}."
  role:
    group_description: "Who gets pinged with the theme"
    set:
      description: "Set the role pinged when the theme is posted"
      param_role: "Role to ping when the theme is posted"
      success: "Bi-weekly themes will ping %{role}."
    remove:
      description: "Stop pinging a role with the theme"
      success: "Bi-weekly themes no longer ping a role."
  schedule:
    group_description: "When the bi-weekly theme is posted"
    set:
      description: "Set the day and hour (UTC) the theme is posted on"
      param_day: "Day of the week (UTC)"
      param_hour: "Hour of the day (UTC, 0-23)"
      success: "Themes will be posted every other %{weekday} at %{hour}:00 UTC."
  pause:
    description: "Stop the bi-weekly theme from being posted"
    success: "Bi-weekly themes are paused."
  resume:
    description: "Resume the bi-weekly theme"
    success: "Bi-weekly themes are active again."
  force:
    description: "Post a bi-weekly theme right now"
    no_channel: "No channel is set yet. Use `/biweekly-theme channel set` first."
    no_cards: "The deck is empty. Add a theme with `/biweekly-theme cards add`."
    success: "Posted a bi-weekly theme in %{channel}."
    failed: "I couldn’t post the theme: %{error}"
  status:
    description: "Show the current bi-weekly theme settings"
    title: "Bi-weekly themes"
    channel_field: "Channel"
    role_field: "Role"
    schedule_field: "Schedule"
    schedule_unset: "Not set"
    schedule_value: "Every other %{weekday} at %{hour}:00 UTC"
    state_field: "Status"
    state_active: "Active"
    state_paused: "Paused"
    deck_field: "Deck"
    deck_value: "%{pending} waiting, %{total} in total"
    last_posted_field: "Last posted"
    never_posted: "Never"
    channel_unset: "Not set"
    role_unset: "No role pinged"

  cards:
    group_description: "The deck of themes the bi-weekly post draws from"
    add:
      description: "Add a theme to the deck"
      param_title: "The theme’s main prompt"
      param_description: "Extra text shown under the prompt (optional)"
      success: "Added the theme “%{title}”."
    edit:
      description: "Change a theme in the deck"
      param_card: "Which theme (start typing to search)"
      param_title: "A new main prompt"
      param_description: "New text under the prompt (optional)"
      success: "Updated the theme “%{title}”."
    remove:
      description: "Remove a theme from the deck"
      param_card: "Which theme (start typing to search)"
      success: "Removed the theme “%{title}”."
    list:
      description: "List the themes in the deck"
      empty: "The deck is empty. Add a theme with `/biweekly-theme cards add`."
      title: "Theme #%{id}"
      pending: "Waiting to be posted"
      posted: "Posted %{when}"

  post:
    embed_title: "This fortnight’s reading theme"
    failed_title: "Bi-weekly theme image failed"
    failed_description: "I couldn’t create the image for the theme “%{title}”. This run was skipped; the theme stays in the deck.\n\nError: %{error}"

  errors:
    generic: "Something went wrong with that theme."
    missing_title: "The theme needs a main prompt."
    title_too_long: "That prompt is %{length} characters long; the max is %{maximum}."
    description_too_long: "That description is %{length} characters long; the max is %{maximum}."
    duplicate_card: "A theme with the prompt “%{title}” is already in the deck."
    card_not_found: "I couldn’t find a theme with id %{id}."
    invalid_weekday: "That isn’t a day of the week I recognise."
    invalid_hour: "`%{hour}` isn’t a valid hour of the day (0-23)."
    image_failed: "I couldn’t create the theme image for “%{title}”: %{error}"
