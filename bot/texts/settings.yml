# Texts for the /settings commands (bot-wide settings editable at runtime).
settings:
  group_description: "View and edit the bot's settings"
  keys:
    purge_book_releases: "Released books"
    purge_streak_logs: "Streak logs"
    review_repost_cooldown_days: "Review repost cooldown"
    releases_post_hour: "Release post hour"
    bot_updates_channel_id: "Updates channel"
    transparent_embed_image: "Transparent embed image"
    default_embed_color: "Default embed color"
  list:
    description: "Show the bot's settings"
    title: "Settings"
    hint: "Retention windows are in days, and the release post hour is in UTC."
    value_days: "%{days} day(s)"
    value_hour: "%{hour} UTC"
    value_color: "%{color}"
    value_none: "Not set"
  edit:
    description: "Change one of the bot's settings"
    param_key: "Which setting to change"
    param_value: "The new value"
    success: "%{key} is now %{value}."
    invalid_value: "'%{value}' is not valid: %{expected}."
    expected:
      days: "pick a whole number of days between %{min} and %{max}"
      hour: "pick an hour between %{min_hour} and %{max_hour} (UTC)"
      channel: "mention a channel or paste its id, or 'none' to clear it"
      url: "paste an http(s) URL, or 'none' to clear it"
      color: "paste a hex color like #97a97c, or 'none' to clear it"
