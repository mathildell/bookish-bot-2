# Texts for the /settings commands (bot-wide settings editable at runtime).
settings:
  group_description: "View and edit the bot's settings"
  keys:
    purge_book_releases: "Released books"
    purge_streak_logs: "Streak logs"
    review_repost_cooldown_days: "Review repost cooldown"
    releases_post_hour: "Release post hour"
    bot_updates_channel_id: "Updates channel"
    transparent_embed_image: "Transparent embed image"
    default_embed_color: "Default embed color"
    buddy_read_channel_id: "Buddy read channel"
    buddy_read_message_link: "Buddy read message"
    admin_test_channel_id: "Admin test channel"
  list:
    description: "Show the bot's settings"
    title: "Settings"
    heading: "### %{label}"
    value: "Value: `%{value}`"
    value_unit: "Value: `%{value}` %{unit}"
    value_plain: "Value: %{value}"
    unit_days: "days"
    unit_hour: "UTC"
    value_none: "none"
    info:
      purge_book_releases: "-# Time the books are kept in the releases table after the release announcement was posted."
      purge_streak_logs: "-# Time a streak's daily log is kept before it is purged (streak totals persist)."
      review_repost_cooldown_days: "-# Time an edited review must wait before it can be reposted."
      releases_post_hour: "-# The UTC hour the daily release announcements are posted."
      bot_updates_channel_id: "-# Channel notified about upkeep events (streak closures, unlinked boosters)."
      transparent_embed_image: "-# Publicly reachable image used as a transparent embed background."
      default_embed_color: "-# Default colour applied to every embed the bot sends."
      buddy_read_channel_id: "-# Forum channel where new threads get the reference message pinned."
      buddy_read_message_link: "-# Message reposted into new forum threads."
      admin_test_channel_id: "-# Channel where channel-locked commands work regardless of their lock."
  edit:
    description: "Change one of the bot's settings"
    param_key: "Which setting to change"
    param_value: "The new value"
    success: "%{label} is now %{value}."
    invalid_value: "'%{value}' is not valid: %{expected}."
    expected:
      days: "pick a whole number of days between %{min} and %{max}"
      hour: "pick an hour between %{min_hour} and %{max_hour} (UTC)"
      channel: "mention a channel or paste its id, or 'none' to clear it"
      url: "paste an http(s) URL, or 'none' to clear it"
      color: "paste a hex color like #97a97c, or 'none' to clear it"
      message_link: "paste a Discord message link, or 'none' to clear it"
